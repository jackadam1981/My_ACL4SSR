[custom]
;不要随意改变关键字，否则会导致出错
;基于 ACL4SSR_Online_Full 的自定义规则

;去广告：支持（🛑 广告拦截 / 🍃 应用净化）
;自动测速：支持（按 Cloudflare colo 聚合的地区/国家自动测速组）
;微软服务：默认直连（Bing / OneDrive / Microsoft）
;苹果服务：默认直连（Apple）
;增强中国IP段：支持（ChinaDomain / ChinaCompanyIp / GEOIP CN）
;增强国外 GFW：支持（ProxyGFWlist + 国外媒体）

;=== 规则集 ===
;顺序说明：自上而下先命中先生效。直连白名单 → 拦截 → 分应用/媒体（🔞 成人同组最末）→ GFW 大表 → 国内收口 → GeoIP → FINAL。

;1) 全球直连 - 前置白名单
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/CloudflareCIDR.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
;Cursor IDE 直连补丁（自建增量规则）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/refs/heads/main/lists-used/cursor_direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

;2) Github（GitHub Copilot 先于 Copilot 大表，避免被 AI 组抢走）
ruleset=🐙 Github,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/GithubCopilot.list
ruleset=🐙 Github,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list

;3) 被墙 AI（Copilot 需先于 Microsoft 直连规则）
ruleset=💬 被墙AI,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/Copilot.list
ruleset=💬 被墙AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 被墙AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

;4) 全球直连 - 常用服务
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

;5) 去广告 / 应用净化（须在媒体、GFW 大表之前，否则易先走代理导致拦截失效）
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

;6) 分应用与媒体
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=⌨️ 程序员用,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Docker.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
;成人内容先于通用国外媒体，避免被 ProxyMedia 大表抢先命中
ruleset=🔞 成人18禁,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Porn.list
ruleset=🔞 成人18禁,https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/refs/heads/main/lists-used/adult.list
ruleset=🌏 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

;7) 代理服务（GFW 大表，放在分应用/媒体之后以免覆盖更细的策略）
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

;8) 全球直连 - 国内服务与下载收口
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

;9) GeoIP
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=🎯 全球直连,[]GEOIP,CN

;10) 最终规则 - 漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL

;=== 分组配置 ===
