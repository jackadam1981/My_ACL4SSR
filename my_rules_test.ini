;基础配置（展开规则集，同时套用 DNS 模板）
;本文件专测「自托管 clash_rule_base」：规则与 my_rules.ini 相同，clash_rule_base 指向本仓库 GeneralClashConfig.yml；订阅 config= 指向本文件 raw
;对照 ACL4SSR 官方底稿：把下一行改为 https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml
