[custom]
;不要随意改变关键字，否则会导致出错
;基于 ACL4SSR_Online_Full 的自定义规则

;去广告：支持（🛑 广告拦截 / 🍃 应用净化）
;自动测速：支持（snippets / 原生地址 / 电信）
;微软服务：默认直连（Bing / OneDrive / Microsoft）
;苹果服务：默认直连（Apple）
;增强中国IP段：支持（ChinaDomain / ChinaCompanyIp / GEOIP CN）
;增强国外 GFW：支持（ProxyGFWlist + 国外媒体）

;=== 规则集 ===
;基础直连与常用服务
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
;Cursor IDE 直连（避免被媒体规则覆盖）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/main/cursor_direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
;Cloudflare CDN（使用 cmliu 仓提供的 IP 段，直接走全球直连）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
;AI 平台（使用主仓 ACL4SSR 提供的 AI 规则）
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
;程序员专用（策略由下方 ⌨️ 程序员用 分组控制）
ruleset=⌨️ 程序员用,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/Copilot.list
ruleset=⌨️ 程序员用,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/GithubCopilot.list
ruleset=⌨️ 程序员用,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Docker.list
ruleset=⌨️ 程序员用,https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/main/programmer.list
;Github 独立规则（默认走 snippets 分组）
ruleset=🐙 Github,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list
;音乐、视频、媒体
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🌏 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
;去广告
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
;代理服务（包含 GFW 列表）
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
;国内服务
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
;GeoIP 规则
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=🎯 全球直连,[]GEOIP,CN
;成人内容 - 强制代理
ruleset=🔞 成人18禁,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Porn.list
ruleset=🔞 成人18禁,https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/main/adult.list
;最终规则 - 漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL

;=== 分组配置 ===
;基础代理组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🚀 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

;功能分组
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换`[]DIRECT
; AI 平台：统一入口，由策略组决定最终走向
custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]🚀 手动切换

;额外自定义分组
;程序员专用：默认代理，可手动切换到直连或各测速分组
custom_proxy_group=⌨️ 程序员用`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`[]DIRECT`.*
;Github 独立分组：优先走 snippets，其次可手动切换
custom_proxy_group=🐙 Github`select`[]snippets`[]🚀 节点选择`[]♻️ 自动选择`[]原生地址`[]电信`[]DIRECT`.*
custom_proxy_group=🔞 成人18禁`select`[]🚀 节点选择`[]♻️ 自动选择`[]snippets`[]原生地址`[]电信`.*
;地区节点自动测试组
; 新测速分组：按名称关键字匹配节点
custom_proxy_group=snippets`url-test`(snippets|Snippets|SNIPPETS)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=原生地址`url-test`(原生|native|Native)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=电信`url-test`(电信|CT|ChinaTelecom)`http://www.gstatic.com/generate_204`300,,50
;基础配置（展开规则集，同时套用 DNS 模板）
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/main/base_rule_providers.yaml