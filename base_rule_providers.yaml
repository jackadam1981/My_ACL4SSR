# 已合并进 GeneralClashConfig.yml；my_rules.ini 的 clash_rule_base 请指向该文件。
# 保留本文件仅为兼容旧链接。
dns:
  # DNS 防泄漏最小模板：
  # 1. 所有客户端 DNS 请求先进 Clash 内建 DNS（listen）
  # 2. 根据规则（respect-rules）决定走直连还是代理
  # 3. nameserver 用于解析国内/常规域名
  # 4. fallback 使用加密公共 DNS，主要解析需要代理的国外域名
  # 5. proxy-server-nameserver 供代理节点自己解析域名，防止节点直连外泄
  enable: true
  listen: :1053
  enhanced-mode: fake-ip
  respect-rules: true

  nameserver:
    - 119.29.29.29
    - 223.5.5.5

  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853
    - https://dns.google/dns-query

  proxy-server-nameserver:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853

  fallback-filter:
    geoip: true
    ipcidr:
      - 0.0.0.0/0
      - ::/0
