# My_ACL4SSR — clash_rule_base（收缩版）
#
# 与 ACL4SSR/Clash/GeneralClashConfig.yml 中「已启用」项对齐：端口、LAN、日志、API、experimental、CFW 延迟与连接策略。
# 不含：官方注释掉的 mode / dns；不含官方超长 cfw-bypass（CFW 系统代理用；OpenClash 可忽略，且体积大）。
# 订阅合并仍需要文末 proxies: []；OpenClash 全局 TUN/DNS 覆写见 GeneralClashConfig.tun-openclash.yml。
#
# 逐项加回 Meta/自研项时请配合 my_rules_test.ini 更新订阅做 A/B（建议顺序见文末注释）。

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: true
log-level: info
external-controller: 127.0.0.1:9090

experimental:
  ignore-resolve-fail: true

cfw-latency-timeout: 3000
cfw-latency-url: http://www.gstatic.com/generate_204
cfw-conn-break-strategy:
  proxy: none
  profile: true
  mode: false
cfw-proxies-order: default

# --- 建议逐项加回测试顺序（从上一版完整底稿复制即可）---
# 1) mode: rule
# 2) unified-delay、tcp-concurrent、keep-alive-interval、profile
# 3) geodata-mode、geo-auto-update、geo-update-interval、geox-url
# 4) sniffer
# 5) dns（含 fake-ip、nameserver-policy 等）

proxies: []
