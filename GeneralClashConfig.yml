# My_ACL4SSR - clash_rule_base（通用底稿）
#
# 职责边界：
# - 本文件只提供 Clash/Mihomo 的基础运行字段和 proxies: [] 占位。
# - 分流规则、策略组、Cloudflare colo 国家/地区测速组都在 my_rules.ini / my_rules_test.ini 生成。
# - 本文件包含通用 DNS 防泄漏模板；OpenClash 侧仍需启用 DNS 劫持 / 使用 Clash DNS，确保客户端 DNS 进入 Clash。
#
# 逐项调整 Meta/自研项时请配合 my_rules_test.ini 更新订阅做 A/B（建议顺序见文末注释）。

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true

experimental:
  ignore-resolve-fail: true

# DNS 防泄漏最小模板：
# 1. 所有客户端 DNS 请求先进 Clash 内建 DNS（listen）
# 2. 根据规则（respect-rules）决定走直连还是代理
# 3. nameserver 用于解析国内/常规域名
# 4. fallback 使用加密公共 DNS，主要解析需要代理的国外域名
# 5. proxy-server-nameserver 供代理节点自己解析域名，防止节点直连外泄
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: false
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://cloudflare-dns.com/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com

cfw-latency-timeout: 3000
cfw-latency-url: http://www.gstatic.com/generate_204
cfw-conn-break-strategy:
  proxy: none
  profile: true
  mode: false
cfw-proxies-order: default

# --- 建议逐项调整测试顺序 ---
# 1) mode: rule（已加回）
# 2) unified-delay、tcp-concurrent、keep-alive-interval、profile（已加回）
# 3) geodata-mode、geo-auto-update、geo-update-interval、geox-url
# 4) sniffer
# 5) dns（含 fake-ip、nameserver-policy 等）

proxies: []
