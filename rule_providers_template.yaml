port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: :9090

# --- DNS 防泄漏配置（示例模板） ---
dns:
  # 1. 所有客户端 DNS 请求先进 Clash 内建 DNS（listen）
  # 2. 根据规则（respect-rules）决定走直连还是代理
  # 3. 上游 DNS 分为：国内 nameserver + 国外加密 fallback
  # 4. proxy-server-nameserver 用加密公共 DNS，防止代理节点直连解析泄露
  enable: true
  listen: :1053
  enhanced-mode: fake-ip
  respect-rules: true
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - tls://1.1.1.1:853
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    ipcidr:
      - 0.0.0.0/0
      - ::/0

# 节点由订阅填充，这里只定义分组结构
proxies: []

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🚀 手动切换"
      - "DIRECT"

  - name: "🚀 手动切换"
    type: select
    proxies: []   # 由订阅自动填充所有节点

  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []   # 由订阅自动填充需要测速的节点

  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "DIRECT"

rules:
  # 本地网段直连
  - DOMAIN-SUFFIX,lan,🎯 全球直连
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve

  # Cursor IDE 直连示例
  - DOMAIN-SUFFIX,cursor.com,🎯 全球直连
  - DOMAIN-SUFFIX,cursor.sh,🎯 全球直连

  # GFW 列表走节点选择（使用 providers/ProxyGFWlist.yaml）
  - RULE-SET,ACL4SSR_ProxyGFWlist,🚀 节点选择

  # 其他自定义规则集示例（使用 providers/*.yaml）
  - RULE-SET,LocalAreaNetwork,🎯 全球直连
  - RULE-SET,GoogleCN,🎯 全球直连
  - RULE-SET,SteamCN,🎯 全球直连
  - RULE-SET,UnBan,🚀 节点选择
  - RULE-SET,CloudflareCIDR,🚀 节点选择
  - RULE-SET,programmer,🚀 节点选择
  - RULE-SET,Copilot,🚀 节点选择
  - RULE-SET,GithubCopilot,🚀 节点选择
  - RULE-SET,cursor_direct,🎯 全球直连
  - RULE-SET,adult,🚀 节点选择

  # 其余全部走漏网之鱼
  - MATCH,🐟 漏网之鱼

rule-providers:
  ACL4SSR_ProxyGFWlist:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/jackadam1981/My_ACL4SSR/main/providers/ProxyGFWlist.yaml
    path: ./ruleset/ACL4SSR/ProxyGFWlist.yaml
    interval: 86400

  LocalAreaNetwork:
